name: Build ShuiCast Standalone

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.txt'
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      
      - name: Apply ShuiCast patches (Netladio, recording file name)
        run: python tools/shuicast_patch.py trunk
        
      - name: Apply dim theme
        run: python tools/shuicast_dim.py trunk
        
      - name: Apply stability fixes (fflush, recording recovery)
        run: python tools/shuicast_fixes.py trunk

      - name: Apply fixes 2 (encoder lock, multi-instance warning, HE-AAC High / LC-AAC)
        run: python tools/shuicast_fixes2.py trunk

      - name: Apply fixes 3 (Live Recording volume with speakers)
        run: python tools/shuicast_fixes3.py trunk

      - name: Apply fixes 4 (encoder comment - Basic Settings field and list column)
        run: python tools/shuicast_fixes4.py trunk
        
      - name: Patch sources for modern toolchain
        working-directory: trunk/shuicast
        shell: pwsh
        run: |
          # "Built on: "__DATE__ のスペース不足を直す (VS2015以降で必須)
          $latin1 = [Text.Encoding]::GetEncoding(28591)
          foreach ($f in Get-ChildItem -File -Filter *.cpp) {
            $text = $latin1.GetString([IO.File]::ReadAllBytes($f.FullName))
            $new = [regex]::Replace($text, '"(__DATE__|__TIME__)', '" ${1}')
            if ($new -ne $text) {
              [IO.File]::WriteAllBytes($f.FullName, $latin1.GetBytes($new))
              Write-Host "patched $($f.Name)"
            }
          }

      - name: Remove prebuilt exe (so a missing build cannot go unnoticed)
        shell: pwsh
        run: Remove-Item trunk/bin/shuicast.exe -ErrorAction SilentlyContinue

      - name: Build shuicast_standalone (Win32 Release)
        working-directory: trunk/shuicast
        env:
          CL: /DHAVE_STRUCT_TIMESPEC
        run: >
          msbuild shuicast_standalone.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /m /v:minimal

      - name: Bundle exe and DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (-not (Test-Path trunk/bin/shuicast.exe)) { throw 'shuicast.exe was not built' }
          Copy-Item trunk/bin/shuicast.exe dist/
          Get-ChildItem trunk/external/lib/*.dll | Where-Object { $_.BaseName -notmatch '_d$' } | Copy-Item -Destination dist/
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: shuicast-standalone-bundle
          path: dist/
          if-no-files-found: error

      - name: Keep only the latest 2 artifacts
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = 'shuicast-standalone-bundle'
          $json = gh api "repos/${{ github.repository }}/actions/artifacts?name=$name&per_page=100" | ConvertFrom-Json
          $old = $json.artifacts | Where-Object { -not $_.expired } | Sort-Object created_at -Descending | Select-Object -Skip 2
          foreach ($a in $old) {
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$($a.id)"
            Write-Host "deleted artifact $($a.id) ($($a.created_at))"
          }
